name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cunix
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: cunix_grc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cunix -d cunix_grc"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml
      - run: pnpm install --dir backend --frozen-lockfile
      - run: pnpm install --dir frontend --frozen-lockfile
      - run: pnpm run --dir backend check
      - run: pnpm run --dir frontend build
      - run: DATABASE_URL=postgres://cunix:ci-password@localhost:5432/cunix_grc pnpm run --dir backend migrate
      - run: docker build --tag cunix-grc:ci .
      - name: Container smoke test
        run: |
          docker run --detach --rm --name cunix-grc-ci \
            -e DATABASE_URL=postgres://cunix:ci-password@host.docker.internal:5432/cunix_grc \
            --add-host host.docker.internal:host-gateway \
            -p 127.0.0.1:18082:3001 cunix-grc:ci
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:18082/api/health && exit 0; sleep 1; done
          docker logs cunix-grc-ci; exit 1
      - if: always()
        run: docker stop cunix-grc-ci || true
