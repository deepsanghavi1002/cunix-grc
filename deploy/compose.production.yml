services:
  db:
    image: postgres:16-alpine
    container_name: cunix-grc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cunix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: cunix_grc
    volumes:
      - /home/dhs/apps/cunix-grc/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cunix -d cunix_grc"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  app:
    image: ${DEPLOY_IMAGE:?Set DEPLOY_IMAGE}
    container_name: cunix-grc
    restart: unless-stopped
    env_file: /home/dhs/apps/cunix-grc/cunix-grc.env
    environment:
      DATABASE_URL: postgres://cunix:${POSTGRES_PASSWORD}@db:5432/cunix_grc
      PORT: 3001
    ports:
      - "127.0.0.1:8082:3001"
      - "100.103.62.30:8082:3001"
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

